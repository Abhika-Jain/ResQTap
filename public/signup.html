<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | Safety App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Main CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- 🏠 APP HEADER -->
  <header class="app-header">
    <img src="assets/logo.PNG" alt="ResQTap Logo" class="logo">
    <h1 class="app-name">ResQTap</h1>
  </header>

  <!-- 📦 SIGNUP CARD -->
  <main class="container auth-container">

    <h2 class="auth-title">Create Account</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
      class="auth-input"
    />

    <input
      type="password"
      id="password"
      placeholder="Password"
      class="auth-input"
    />

    <button onclick="signup()" class="primary-btn">
      Sign Up
    </button>

    <p class="auth-text">
      Already have an account?
      <a href="login.html" class="link">Login</a>
    </p>

  </main>

  <!-- 🔥 FIREBASE + SIGNUP LOGIC -->
    <!-- 🔐 SIGNUP LOGIC -->
  <script type="module" src="js/firebase_init.js"></script>
  <script type="module" src="js/signup.js"></script>

</body>
</html>
